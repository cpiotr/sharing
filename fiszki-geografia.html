<!DOCTYPE html>
<html lang="pl">

    <style>
        .perspective-1000 { perspective: 1000px; }

        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>

            <span id="score-counter" class="bg-amber-400/80 backdrop-blur-sm px-3 py-1 rounded-full text-amber-900 shadow">🌟 Gwiazdki: 0</span>
        </div>

        <div class="w-full h-96 perspective-1000 cursor-pointer" id="flashcard-container" data-action="flip" aria-label="Odwróć fiszkę">
            <div id="flashcard" class="relative w-full h-full duration-500 transform-style-3d shadow-2xl rounded-3xl transition-transform">

                <!-- Przód: pytanie -->
                <div class="absolute inset-0 w-full h-full bg-white rounded-3xl p-6 flex flex-col items-center justify-center border-4 border-teal-200 backface-hidden">
                    <div id="card-emoji" class="text-5xl mb-2">🗺️</div>
                    <span id="front-label" class="text-xs uppercase tracking-widest text-teal-500 font-bold mb-2 text-center"></span>
                    <h2 id="front-main" class="text-xl font-extrabold text-teal-800 mb-2 text-center leading-snug"></h2>
                    <span class="text-xs text-slate-400 mt-2 bg-teal-50 px-4 py-2 rounded-full border border-teal-100">👆 Kliknij, aby sprawdzić!</span>
                </div>

                <!-- Tył: odpowiedź -->
                <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-teal-700 to-sky-800 text-white rounded-3xl p-6 flex flex-col items-center justify-center rotate-y-180 backface-hidden border-4 border-teal-300">

                    <div id="back-content" class="text-center overflow-y-auto max-h-60 w-full"></div>
                    <button id="steps-button" type="button" data-action="start-steps" class="hidden mt-3 bg-amber-300 hover:bg-amber-200 text-teal-900 font-bold text-sm px-4 py-2 rounded-xl shadow">Ćwicz krok po kroku →</button>
                </div>

            </div>
        </div>

        <!-- Powrót z ćwiczenia krok po kroku -->
        <button id="level-button" data-action="return-to-card" class="hidden w-full mt-3 bg-white/90 hover:bg-white text-teal-700 font-bold py-2 px-3 rounded-xl shadow transition text-sm">↩ Wróć do pytania głównego</button>

        <div class="flex gap-3 w-full mt-5">
            <button data-action="prev" class="flex-1 bg-white/80 hover:bg-white text-teal-700 font-bold py-3 px-3 rounded-2xl shadow-lg transition transform active:scale-95 text-sm">⬅️ Wstecz</button>
            <button data-action="next-known" class="flex-1 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold py-3 px-3 rounded-2xl shadow-lg transition transform active:scale-95 text-sm">Umiem! ⭐</button>

        </div>

    </footer>

                  { q: "Czym jest źródło rzeki?", a: "Miejscem, gdzie wody podziemne wypływają na powierzchnię." },
                  { q: "Co tworzy system rzeczny?", a: "Rzeka główna wraz z dopływami." },
                  { q: "Czym jest dorzecze?", a: "Obszarem, z którego wody spływają do jednego systemu rzecznego." },
                  { q: "Czym jest zlewisko?", a: "Obszarem, z którego wody spływają do jednego morza." },
                  { q: "Czym jest dział wodny?", a: "Granicą między dorzeczami lub zlewiskami." }
              ] },

            // ===== 6: Wody powierzchniowe w Polsce =====
            { block: 6, emoji: "🏞️", q: "Jakie są najdłuższe rzeki w Polsce i gdzie uchodzą?",
              lead: "Najdłuższe rzeki Polski:",
              items: [
                  "najdłuższa jest <strong>Wisła</strong> (1022 km)",
                  "drugie miejsce zajmuje <strong>Odra</strong> (841 km, w tym 716 km na terenie Polski)",
                  "obie rzeki uchodzą wprost do Morza Bałtyckiego, tworząc jego zlewisko"
              ],
              topic: "Najdłuższe rzeki",
              steps: [
                  { q: "Jaka rzeka jest najdłuższa w Polsce i ile ma kilometrów?", a: "Wisła – 1022 km." },
                  { q: "Jaka rzeka zajmuje drugie miejsce pod względem długości?", a: "Odra – 841 km, w tym 716 km na terenie Polski." },
                  { q: "Gdzie uchodzą Wisła i Odra?", a: "Wprost do Morza Bałtyckiego, tworząc jego zlewisko." }
              ] },
            { block: 6, emoji: "⚖️", q: "Czym charakteryzują się dorzecza Wisły i Odry w Polsce?",
              a: "Są asymetryczne – ich części lewobrzeżne zajmują mniejszą powierzchnię niż prawobrzeżne, co wynika z nachylenia powierzchni naszego kraju w kierunku północno-zachodnim." },
            { block: 6, emoji: "❄️", q: "Jaki rodzaj zasilania mają rzeki w Polsce i kiedy występują największe przepływy?",
              a: "Mają zasilanie deszczowo-śnieżne. Największe przepływy występują wczesną wiosną (gdy topnieje śnieg) oraz latem (w wyniku opadów deszczu)." },
            { block: 6, emoji: "🌀", q: "Co to jest starorzecze i jak powstało nad Odrą?",
              a: "Jest to zbiornik wodny odcięty od obecnego koryta rzeki. Powstało w wyniku regulacji rzeki Odry, która została przekształcona w najdłuższą śródlądową drogę wodną w Polsce." },
            { block: 6, emoji: "🏝️", q: "Jakie są najważniejsze typy jezior w Polsce ze względu na genezę (sposób powstania)?",
              lead: "Typy jezior:",
              items: [
                  { text: "<strong>jeziora polodowcowe</strong> (przeważają w Polsce):", sub: [
                      "<strong>rynnowe</strong> (np. Jeziorak, Gopło) – podłużne i głębokie",
                      "<strong>morenowe</strong> (np. Śniardwy, Mamry) – płytkie, rozległe, o urozmaiconej linii brzegowej",
                      "<strong>cyrkowe</strong> (np. Czarny Staw pod Rysami) – małe i głębokie, występujące w górach"
                  ] },
                  "<strong>jeziora przybrzeżne</strong> (np. Gardno, Łebsko) – powstały w wyniku odcięcia zatok morskich przez mierzeje"
              ],
              topic: "Typy jezior",
              steps: [
                  { q: "Jak charakteryzują się jeziora rynnowe? Podaj przykłady.", a: "Są polodowcowe, podłużne i głębokie (np. Jeziorak, Gopło)." },
                  { q: "Jak charakteryzują się jeziora morenowe? Podaj przykłady.", a: "Są polodowcowe, płytkie, rozległe, o urozmaiconej linii brzegowej (np. Śniardwy, Mamry)." },
                  { q: "Jak charakteryzują się jeziora cyrkowe? Podaj przykład.", a: "Są polodowcowe, małe i głębokie, występują w górach (np. Czarny Staw pod Rysami)." },
                  { q: "Jak powstały jeziora przybrzeżne? Podaj przykłady.", a: "W wyniku odcięcia zatok morskich przez mierzeje (np. Gardno, Łebsko)." }
              ] },
            { block: 6, emoji: "🏆", q: "Jakie są rekordowe jeziora w Polsce pod względem powierzchni i głębokości?",
              lead: "Rekordowe jeziora:",
              items: [
                  "największe jezioro: <strong>Śniardwy</strong> (113,4 km²)",
                  "drugie co do wielkości: <strong>Mamry</strong> (102,8 km²)",
                  "najgłębsze jezioro: <strong>Hańcza</strong> (108,5 m)"
              ],
              topic: "Rekordowe jeziora",
              steps: [
                  { q: "Które jezioro jest największe w Polsce i ile ma km²?", a: "Śniardwy – 113,4 km²." },
                  { q: "Które jezioro jest drugie co do wielkości?", a: "Mamry – 102,8 km²." },
                  { q: "Które jezioro jest najgłębsze w Polsce i ile ma metrów?", a: "Hańcza – 108,5 m." }
              ] },
            { block: 6, emoji: "🚢", q: "Jakie znaczenie gospodarcze mają rzeki i jeziora w Polsce?",
              lead: "Znaczenie gospodarcze:",
              items: [
                  "są zużywane przez zakłady przemysłowe oraz elektrownie wodne do produkcji energii elektrycznej",
                  "umożliwiają produkcję rolną poprzez nawadnianie pól",
                  "pełnią funkcję dróg śródlądowego transportu wodnego",
                  "obszary pojezierzy sprzyjają turystyce, rekreacji i sportom wodnym"
              ] }
        ];

        // Biblioteka trzyma jedną tablicę kart; filtr działu podmienia jej zawartość w miejscu.
        const cards = allCards.slice();

        // Stan ćwiczenia dwuetapowego: poziom 1 = karta główna, poziom 2 = kroki (każdy punkt osobno)
        let learningLevel = 1;
        let stepIndex = 0;
        const levelButton = document.getElementById("level-button");
        const stepsButton = document.getElementById("steps-button");

        const listHtml = (items, nested = false) =>
            `<ul class="list-disc pl-5 ${nested ? "mt-1" : ""} space-y-1 text-left text-sm leading-snug">` +
            items.map(item => typeof item === "string"
                ? `<li>${item}</li>`
                : `<li>${item.text}${item.sub ? listHtml(item.sub, true) : ""}</li>`
            ).join("") +
            "</ul>";

        const answerHtml = card => {
            let html = "";
            if (card.a) html += `<p class="text-base font-semibold leading-relaxed">${card.a}</p>`;
            if (card.lead) html += `<p class="text-sm font-semibold text-left mb-2 text-amber-200">${card.lead}</p>`;
            if (card.items) html += listHtml(card.items);
            if (card.note) html += `<p class="text-xs text-teal-100 italic mt-2 leading-snug">${card.note}</p>`;
            return html;
        };

        Flashcards.create({
            cards,
            defaultMode: "ALL",
            modeClasses: {
                active: "py-2 text-xs font-bold rounded-xl transition bg-white text-teal-700 shadow-md",
                inactive: "py-2 text-xs font-bold rounded-xl transition text-white hover:bg-white/20"
            },
            scoreLabel: "🌟 Gwiazdki",

            render(card) {
                const inSteps = learningLevel === 2 && card.steps;
                levelButton.classList.toggle("hidden", !inSteps);
                stepsButton.classList.toggle("hidden", !!inSteps || !card.steps);

                if (inSteps) {
                    const step = card.steps[stepIndex];
                    return {
                        emoji: card.emoji,
                        frontLabel: `${card.topic} · krok ${stepIndex + 1} z ${card.steps.length}`,
                        frontMain: step.q,
                        backLabel: "Odpowiedź",
                        backHtml: `<p class="text-base font-semibold leading-relaxed">${step.a}</p>`,
                        counter: `Krok ${stepIndex + 1} / ${card.steps.length}`
                    };
                }
                return {
                    emoji: card.emoji,
                    frontLabel: blocks[card.block],
                    frontMain: card.q,
                    backLabel: "Odpowiedź",
                    backHtml: answerHtml(card)
                };
            },

            // W ćwiczeniu krok po kroku "dalej" / "wstecz" przechodzą po punktach, nie po kartach.
            onNext(app) {
                if (learningLevel !== 2) return false;
                if (stepIndex < app.cards[app.index].steps.length - 1) {
                    stepIndex++;
                    return true;
                }
                learningLevel = 1; // koniec ćwiczenia – biblioteka przejdzie do następnej karty
                stepIndex = 0;
                return false;
            },
            onPrev() {
                if (learningLevel !== 2) return false;
                if (stepIndex > 0) stepIndex--;
                else learningLevel = 1;
                return true;
            },
            onModeChange(app) {
                const filtered = app.mode === "ALL" ? allCards : allCards.filter(c => String(c.block) === app.mode);
                cards.splice(0, cards.length, ...filtered);
                app.index = 0;
                learningLevel = 1;
                stepIndex = 0;
            },
            onReset() { learningLevel = 1; stepIndex = 0; },

            actions: {
                "start-steps"(app) {
                    if (!app.cards[app.index].steps) return;
                    learningLevel = 2;
                    stepIndex = 0;
                    app.update();
                },
                "return-to-card"(app) {
                    learningLevel = 1;
                    stepIndex = 0;
                    app.update();
                }
            }
        });
    </script>
</body>
</html>
