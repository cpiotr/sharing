              topic: "Represje",
              steps: [
                  { q: "Co to jest kontrybucja?", a: "Obowiązkowe świadczenie pieniężne nakładane przez zwycięzcę na ludność kraju okupowanego." },
                  { q: "Czemu miała służyć Cytadela Warszawska i jak nazywano jej część?", a: "Miała zapewnić Rosjanom kontrolę nad miastem i zapobiegać buntom; jej częścią była tzw. Brama Straceń." },
                  { q: "Co to jest katorga?", a: "Ciężka, niewolnicza praca w kopalniach lub przy wyrębie tajgi." },
                  { q: "Kiedy ogłoszono stan wojenny w Królestwie Polskim?", a: "W 1833 r." },
                  { q: "Kiedy wprowadzono w Królestwie Polskim rosyjski kodeks karny?", a: "W 1847 r." }
              ] },
            { block: 5, emoji: "😠", q: "Kim był Iwan Paskiewicz?",
              a: "Namiestnikiem cara w Królestwie Polskim, słynącym z okrucieństwa, stojącym na czele rządu po ograniczeniu jego kompetencji." },
            { block: 5, emoji: "🗂️", q: "Co to jest gubernia?",
              a: "Jednostka podziału terytorialnego wprowadzona w Rosji i na ziemiach polskich po zlikwidowaniu dawnych województw." },
            { block: 5, emoji: "🇷🇺", q: "Co to jest rusyfikacja?",
              a: "Proces narzucania polskiemu społeczeństwu rosyjskiej kultury, obyczajowości i języka." },
            { block: 5, emoji: "⛪", q: "Czym był Kościół grekokatolicki (unicki) i co się z nim stało po powstaniu?",
              a: "Kościołem łączącym obrządek wschodni z uznaniem władzy papieża. Po powstaniu został zlikwidowany i włączony siłą do Cerkwi prawosławnej." },

            // ===== 6: Lata 1846–1849 i Wiosna Ludów =====
            { block: 6, emoji: "🔥", q: "Czym było powstanie krakowskie?",
              a: "Próbą zorganizowania w 1846 r. ogólnonarodowego powstania we wszystkich zaborach, która w pełni powiodła się jedynie w Krakowie.",
              topic: "Powstanie krakowskie",
              steps: [
                  { q: "Kiedy wybuchło powstanie krakowskie?", a: "W nocy z 21 na 22 lutego 1846 r." },
                  { q: "Co zapowiedziano w Manifeście do narodu polskiego?", a: "M.in. równość obywateli wobec prawa, zniesienie pańszczyzny i nadanie ziemi chłopom na własność." },
                  { q: "Co stało się z Rzeczpospolitą Krakowską 16 listopada 1846 r.?", a: "Została wcielona do Austrii." }
              ] },
            { block: 6, emoji: "🪓", q: "Czym była rabacja galicyjska (rzeź galicyjska)?",
              a: "Masowymi rozruchami i krwawymi wystąpieniami chłopskimi w Galicji w lutym 1846 r., skierowanymi przeciwko dworom szlacheckim. Sprowokowały je m.in. plotki o rzekomych planach mordów na chłopach ze strony szlachty." },
            { block: 6, emoji: "🧑‍🌾", q: "Kim był Jakub Szela?",
              a: "Przywódcą chłopskim w okolicach Tarnowa podczas rabacji galicyjskiej w 1846 r." },
            { block: 6, emoji: "🌷", q: "Czym była Wiosna Ludów?",
              a: "Serią rewolucji oraz zrywów narodowych i społecznych w Europie w latach 1848–1849, w których aktywnie uczestniczyli Polacy (m.in. w Wielkopolsce, w Galicji oraz walcząc za wolność innych narodów)." },
            { block: 6, emoji: "📅", q: "Jak przebiegała Wiosna Ludów na ziemiach polskich w 1848 r.?",
              lead: "Wydarzenia 1848 r.:",
              items: [
                  "<strong>marzec</strong> – Komitet Narodowy w Poznaniu",
                  "<strong>wiosna</strong> – Gwardia Narodowa i uwłaszczenie w Galicji",
                  "<strong>kwiecień</strong> – powstanie w Wielkopolsce"
              ],
              topic: "Wiosna Ludów 1848",
              steps: [
                  { q: "Czego Komitet Narodowy w Poznaniu domagał się od władz pruskich?", a: "Pełnej autonomii i spolszczenia administracji w Wielkim Księstwie Poznańskim." },
                  { q: "Czym była Gwardia Narodowa?", a: "Formacją wojskową tworzoną przez Polaków (m.in. w Krakowie i we Lwowie) w celu utrzymania porządku i obrony praw obywatelskich." },
                  { q: "Jaką zmianę dla chłopów przyniósł w Galicji 1848 r.?", a: "Dekret o uwłaszczeniu chłopów i zniesienie pańszczyzny w zaborze austriackim." },
                  { q: "Kto dowodził powstaniem w Wielkopolsce?", a: "Polski generał i działacz polityczny Ludwik Mierosławski (1814–1878)." }
              ] },
            { block: 6, emoji: "🤝", q: "Co oznaczało hasło „Za wolność waszą i naszą”?",
              a: "Było to słynne hasło polskich rewolucjonistów i emigrantów, którzy walczyli o wolność innych narodów (np. we Włoszech czy na Węgrzech), wierząc, że pomoże to odzyskać niepodległość Polsce." },
            { block: 6, emoji: "🎗️", q: "Kim był Józef Bem?",
              a: "Wybitnym polskim dowódcą wojskowym, bohaterem narodowym, który największą sławę zdobył jako naczelny wódz antyaustriackiego powstania na Węgrzech w czasie Wiosny Ludów." }
        ];

        // Biblioteka trzyma jedną tablicę kart; filtr działu podmienia jej zawartość w miejscu.
        const cards = allCards.slice();

        // Stan ćwiczenia dwuetapowego: poziom 1 = karta główna, poziom 2 = kroki (każdy punkt osobno)
        let learningLevel = 1;
        let stepIndex = 0;
        const levelButton = document.getElementById("level-button");
        const stepsButton = document.getElementById("steps-button");

        const listHtml = (items, nested = false) =>
            `<ul class="list-disc pl-5 ${nested ? "mt-1" : ""} space-y-1 text-left text-sm leading-snug">` +
            items.map(item => typeof item === "string"
                ? `<li>${item}</li>`
                : `<li>${item.text}${item.sub ? listHtml(item.sub, true) : ""}</li>`
            ).join("") +
            "</ul>";

        const answerHtml = card => {
            let html = "";
            if (card.a) html += `<p class="text-base font-semibold leading-relaxed">${card.a}</p>`;
            if (card.lead) html += `<p class="text-sm font-semibold text-left mb-2 text-amber-200">${card.lead}</p>`;
            if (card.items) html += listHtml(card.items);
            if (card.note) html += `<p class="text-xs text-orange-100 italic mt-2 leading-snug">${card.note}</p>`;
            return html;
        };

        Flashcards.create({
            cards,
            defaultMode: "ALL",
            modeClasses: {
                active: "py-2 text-xs font-bold rounded-xl transition bg-white text-orange-700 shadow-md",
                inactive: "py-2 text-xs font-bold rounded-xl transition text-white hover:bg-white/20"
            },
            scoreLabel: "🌟 Gwiazdki",

            render(card) {
                const inSteps = learningLevel === 2 && card.steps;
                levelButton.classList.toggle("hidden", !inSteps);
                stepsButton.classList.toggle("hidden", !!inSteps || !card.steps);

                if (inSteps) {
                    const step = card.steps[stepIndex];
                    return {
                        emoji: card.emoji,
                        frontLabel: `${card.topic} · krok ${stepIndex + 1} z ${card.steps.length}`,
                        frontMain: step.q,
                        backLabel: "Odpowiedź",
                        backHtml: `<p class="text-base font-semibold leading-relaxed">${step.a}</p>`,
                        counter: `Krok ${stepIndex + 1} / ${card.steps.length}`
                    };
                }
                return {
                    emoji: card.emoji,
                    frontLabel: blocks[card.block],
                    frontMain: card.q,
                    backLabel: "Odpowiedź",
                    backHtml: answerHtml(card)
                };
            },

            // W ćwiczeniu krok po kroku "dalej" / "wstecz" przechodzą po punktach, nie po kartach.
            onNext(app) {
                if (learningLevel !== 2) return false;
                if (stepIndex < app.cards[app.index].steps.length - 1) {
                    stepIndex++;
                    return true;
                }
                learningLevel = 1; // koniec ćwiczenia – biblioteka przejdzie do następnej karty
                stepIndex = 0;
                return false;
            },
            onPrev() {
                if (learningLevel !== 2) return false;
                if (stepIndex > 0) stepIndex--;
                else learningLevel = 1;
                return true;
            },
            onModeChange(app) {
                const filtered = app.mode === "ALL" ? allCards : allCards.filter(c => String(c.block) === app.mode);
                cards.splice(0, cards.length, ...filtered);
                app.index = 0;
                learningLevel = 1;
                stepIndex = 0;
            },
            onReset(app) {
                learningLevel = 1;
                stepIndex = 0;
                app.setMode("ALL"); // nauka od nowa obejmuje wszystkie działy, nie tylko wybrany
            },

            actions: {
                "start-steps"(app) {
                    if (!app.cards[app.index].steps) return;
                    learningLevel = 2;
                    stepIndex = 0;
                    app.update();
                },
                "return-to-card"(app) {
                    learningLevel = 1;
                    stepIndex = 0;
                    app.update();
                }
            }
        });
    </script>
</body>
</html>
